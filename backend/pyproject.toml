[project]
name = "car-design-explorer-backend"
version = "0.1.0"
description = "Manufacturing-Aware Multi-Agent Design Space Exploration - Backend"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[a2a]>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "bedrock-agentcore[strands-agents]>=0.1.0",
    "boto3>=1.35.0",
    "pydantic>=2.0.0",
    "trimesh>=4.0.0",
    "manifold3d>=2.4",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "mcp",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
